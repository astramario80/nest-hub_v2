<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEST™ Fabrication Management</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/internal-workspaces.css"><link rel="stylesheet" href="/css/fabrication.css"><link rel="stylesheet" href="/css/nest-auth.css"></head><body data-fabrication-manage="true"><header class="internal-header"><a href="/" aria-label="NEST home"><img src="/assets/nest_menu_icon.png" alt="NEST™" class="logo"></a><nav><a href="/print-queue">Public request status</a><button type="button" id="fabrication-signin">NEST sign in</button></nav></header><main class="internal-page fabrication-page"><h1>Fabrication requests</h1><p id="fabrication-message" role="status" aria-live="polite">Checking access…</p><section id="fabrication-workspace" hidden><div class="fabrication-toolbar"><label>Find a request <input id="fabrication-search" type="search" placeholder="Name, equipment, or request ID"></label><label>Status <select id="fabrication-filter"><option value="">All statuses</option></select></label><button type="button" id="fabrication-refresh">Refresh requests</button></div><div class="fabrication-layout"><section aria-label="Request queue"><div id="fabrication-list"></div><div class="fabrication-pagination"><button type="button" id="fabrication-prev">Previous</button><span id="fabrication-page"></span><button type="button" id="fabrication-next">Next</button></div></section><section id="fabrication-detail" class="internal-card" hidden><h2 id="fabrication-title"></h2><p id="fabrication-requestor"></p><dl id="fabrication-fields"></dl><form id="fabrication-edit"><label>Status <select id="fabrication-status"></select></label><label>Public update <textarea id="fabrication-public-note" maxlength="1000" rows="3"></textarea></label><p class="internal-muted">This message appears on the public request window. Leave out names, emails, and private details.</p><label>Internal notes <textarea id="fabrication-notes" maxlength="2000" rows="3"></textarea></label><button type="submit" id="fabrication-save">Save update</button></form><div class="fabrication-email"><p id="fabrication-email-preview"></p><button type="button" id="fabrication-email">Send saved update to requestor</button><p id="fabrication-email-state"></p></div><h3>Public update history</h3><ol id="fabrication-history"></ol><details><summary>Existing sheet history</summary><pre id="fabrication-legacy-log"></pre></details></section></div></section><a href="/print-queue">Back to fabrication</a></main><script src="/js/nest-auth.js"></script><script src="/js/fabrication.js"></script><script src="/js/main.js"></script></body></html>
